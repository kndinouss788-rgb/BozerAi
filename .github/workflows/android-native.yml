name: BOZER Android APK — first phone-test candidate

on:
  push:
    branches: [bozer-neural-v0.1]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bozer-android-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build final debug APK with native llama.cpp
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify APK output and bundled offline French voice
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          python - <<'PY'
          import hashlib
          import zipfile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          voice = "assets/bozer-voice/fr_FR-mls-medium/fr_FR-mls-medium.onnx"
          tokens = "assets/bozer-voice/fr_FR-mls-medium/tokens.txt"
          expected_bytes = 76_733_935
          expected_sha256 = "d869ae962adb97da4d044e263df38d0b012e10bba6d0c3c8a3cb61190d657d9b"

          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              assert voice in names, "French Piper ONNX model is missing from the APK"
              assert tokens in names, "French Piper tokens are missing from the APK"
              model_info = archive.getinfo(voice)
              assert model_info.file_size == expected_bytes, (
                  f"Unexpected voice size: {model_info.file_size}"
              )
              digest = hashlib.sha256()
              with archive.open(voice) as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              assert digest.hexdigest() == expected_sha256, "Bundled French voice SHA-256 mismatch"
              assert any(name.startswith("lib/arm64-v8a/") for name in names), (
                  "ARM64 native libraries are missing from the APK"
              )
              print(f"Bundled French voice: verified ({model_info.file_size} bytes)")
              print(f"Voice SHA-256: {digest.hexdigest()}")
              print("ARM64 native libraries: present")

          print(f"APK size: {__import__('os').path.getsize(apk)} bytes")
          PY
          sha256sum "$APK"
      - name: Upload final installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bozer-final-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
