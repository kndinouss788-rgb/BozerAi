name: BOZER Android APK build — final release only

on:
  # Deliberately manual: no APK builds on ordinary commits or pull requests.
  # Run only when the project owner declares BOZER feature-complete.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bozer-android-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build final debug APK with native llama.cpp
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload final installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bozer-final-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
