name: BOZER core tests

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - feature/platform-assistant-foundation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run decision-core tests
        run: python -m unittest discover -s tests -v
