name: BOZER core tests

on:
  push:
    branches: [main, feature/remote-ai-quota-router, bozer-neural-v0.1]
  pull_request:
    branches: [main, feature/remote-ai-quota-router]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test runner
        run: python -m pip install --upgrade pip pytest
      - name: Install BOZER NEURAL CPU dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-neural.txt
      - name: Run complete Python test suite
        run: python -m pytest tests -v --tb=short
