name: BOZER core tests

on:
  push:
    branches: [main, feature/remote-ai-quota-router]
  pull_request:
    branches: [main, feature/remote-ai-quota-router]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run decision-core tests
        run: python -m unittest discover -s tests -v
