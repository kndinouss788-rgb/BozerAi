name: BOZER NEURAL 1B architecture checks

on:
  push:
    branches:
      - bozer-neural-v0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-and-training-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest
      - name: Compile BOZER NEURAL modules
        run: python -m compileall -q bozer_neural tests
      - name: Run 1B architecture and tiny training tests
        run: python -m pytest -q tests/test_bozer_neural_1b.py tests/test_bozer_neural_1b_training.py
