name: BOZER NEURAL 1B architecture checks and baseline training

on:
  push:
    branches:
      - bozer-neural-v0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bozer-neural-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-training-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest
      - name: Compile BOZER NEURAL modules
        run: python -m compileall -q bozer_neural tests
      - name: Validate French V0.5 training, validation and test partitions
        run: |
          python -m bozer_neural.validate_corpus \
            --train data/bozer_neural_v0_5/train_fr.jsonl \
            --validation data/bozer_neural_v0_5/validation_fr.jsonl \
            --test data/bozer_neural_v0_5/test_fr.jsonl
      - name: Run baseline data and training tests
        run: python -m unittest discover -s tests -p "test_bozer_neural.py" -v
      - name: Run 1B architecture and tiny training tests
        run: python -m pytest -q tests/test_bozer_neural_1b.py tests/test_bozer_neural_1b_training.py tests/test_bozer_neural_1b_evaluation.py tests/test_bozer_pretraining_corpus.py tests/test_bozer_tts_corpus.py tests/test_bozer_voice_profile.py tests/test_moore_french_translator.py tests/test_malm_lexicon_import.py
      - name: Train small BOZER baseline from random initialization
        run: |
          python -m bozer_neural.train \
            --data data/bozer_neural_v0_5/train_fr.jsonl \
            --validation-data data/bozer_neural_v0_5/validation_fr.jsonl \
            --steps 600 \
            --batch-size 8 \
            --learning-rate 3e-4 \
            --eval-interval 25 \
            --eval-batches 4 \
            --tokenizer-vocab-size 512 \
            --grad-accum-steps 2 \
            --warmup-steps 20 \
            --early-stopping-patience 5 \
            --output artifacts/bozer-neural-v0.4-corpus-v0.5.pt
      - name: Evaluate all held-out V0.5 test examples
        run: |
          python -m bozer_neural.evaluate \
            --checkpoint artifacts/bozer-neural-v0.4-corpus-v0.5.best.pt \
            --data data/bozer_neural_v0_5/test_fr.jsonl \
            --batches 12 \
            --samples 60 \
            --max-new-tokens 96 \
            --report artifacts/bozer-neural-corpus-v0.5-test-report.json
      - name: Upload baseline checkpoint and test report
        uses: actions/upload-artifact@v4
        with:
          name: bozer-neural-baseline-corpus-v0.5
          path: |
            artifacts/bozer-neural-v0.4-corpus-v0.5.pt
            artifacts/bozer-neural-v0.4-corpus-v0.5.json
            artifacts/bozer-neural-v0.4-corpus-v0.5.best.pt
            artifacts/bozer-neural-corpus-v0.5-test-report.json
          if-no-files-found: error
          retention-days: 14
