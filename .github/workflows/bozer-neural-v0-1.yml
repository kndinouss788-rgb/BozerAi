name: BOZER NEURAL V0.1 checks

on:
  push:
    branches: [bozer-neural-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  neural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch
        run: python -m pip install -r requirements-neural.txt
      - name: Run BOZER NEURAL tests
        run: python -m unittest discover -s tests -p "test_bozer_neural.py" -v
      - name: Verify parameter count and architecture
        run: python -c "from bozer_neural import BozerTransformer; m=BozerTransformer(); n=sum(p.numel() for p in m.parameters() if p.requires_grad); print(f'BOZER NEURAL parameters: {n}'); assert n == 124864"
