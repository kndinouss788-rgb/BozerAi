name: BOZER NEURAL corpus, tokenizer and model checks

on:
  push:
    branches: [bozer-neural-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neural-tests:
    name: Validate corpus and neural pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch
        run: python -m pip install -r requirements-neural.txt
      - name: Validate categorized corpus and split leakage
        run: python -m bozer_neural.validate_corpus
      - name: Run BOZER NEURAL tests
        run: python -m unittest discover -s tests -p "test_bozer_neural.py" -v
      - name: Verify feedback-learning command
        run: python -m bozer_neural.learning --help
      - name: Verify baseline architecture
        run: python -c "from bozer_neural import BozerTransformer; m=BozerTransformer(); n=sum(p.numel() for p in m.parameters() if p.requires_grad); print(f'Baseline parameters: {n}'); assert n == 124864"
