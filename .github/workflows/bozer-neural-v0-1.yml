name: BOZER NEURAL corpus, tokenizer and model checks

"on":
  push:
    branches: [bozer-neural-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neural-tests:
    name: Validate corpus and neural pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-neural.txt
      - name: Install PyTorch
        run: python -m pip install -r requirements-neural.txt
      - name: Validate categorized corpus and split leakage
        run: python -m bozer_neural.validate_corpus
      - name: Run BOZER NEURAL tests
        run: python -m unittest discover -s tests -p "test_bozer_neural.py" -v
      - name: Verify feedback-learning command
        run: python -m bozer_neural.learning --help
      - name: Verify baseline architecture
        run: python -c "from bozer_neural import BozerTransformer, BozerConfig; m=BozerTransformer(); n=sum(p.numel() for p in m.parameters() if p.requires_grad); print(f'Baseline parameters: {n}'); assert n == BozerConfig().parameter_count() == 124864"
      - name: Run a short real training smoke test
        run: python -m bozer_neural.train --steps 10 --batch-size 2 --grad-accum-steps 1 --eval-interval 5 --eval-batches 1 --warmup-steps 2 --early-stopping-patience 0 --output artifacts/bozer-neural-ci.pt
      - name: Evaluate the best smoke checkpoint on the untouched test split
        run: python -m bozer_neural.evaluate --checkpoint artifacts/bozer-neural-ci.best.pt --data data/bozer_neural_v0_4/test_fr.jsonl --batches 2 --samples 12 --max-new-tokens 48 --report artifacts/bozer-neural-ci-evaluation.json
      - name: Upload reproducible smoke checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: bozer-neural-v0-4-smoke
          path: |
            artifacts/bozer-neural-ci.pt
            artifacts/bozer-neural-ci.json
            artifacts/bozer-neural-ci.best.pt
            artifacts/bozer-neural-ci-evaluation.json
          if-no-files-found: error
