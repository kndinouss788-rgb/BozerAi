name: BOZER Android emulator and real-brain tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-brain-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore cached Qwen model
        uses: actions/cache@v4
        with:
          path: .ci-cache/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: bozer-qwen-0.5b-74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      - name: Download and verify Qwen model for emulator
        run: |
          mkdir -p .ci-cache
          if [ ! -s .ci-cache/qwen2.5-0.5b-instruct-q4_k_m.gguf ]; then
            curl -fL --retry 3 --retry-delay 3 \
              "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/12145bd1d629190a4d44254073650877954d02c9/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
              -o .ci-cache/qwen2.5-0.5b-instruct-q4_k_m.gguf
          fi
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  .ci-cache/qwen2.5-0.5b-instruct-q4_k_m.gguf" | sha256sum -c -
          printf '%s' '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db' > .ci-cache/model.sha256
      - name: Build APK with native llama.cpp
        run: gradle :app:assembleDebug --no-daemon
      - name: Install, run real inference tests, and capture diagnostics
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            APP_MODEL_DIR="/data/user/0/ai.bozer.app/files/models"
            adb shell run-as ai.bozer.app mkdir -p "$APP_MODEL_DIR"
            adb push .ci-cache/qwen2.5-0.5b-instruct-q4_k_m.gguf /data/local/tmp/bozer-qwen.gguf
            adb push .ci-cache/model.sha256 /data/local/tmp/bozer-model.sha256
            adb exec-out cat /data/local/tmp/bozer-qwen.gguf | adb shell run-as ai.bozer.app sh -c "cat > '$APP_MODEL_DIR/qwen2.5-0.5b-instruct-q4_k_m.gguf'"
            adb exec-out cat /data/local/tmp/bozer-model.sha256 | adb shell run-as ai.bozer.app sh -c "cat > '$APP_MODEL_DIR/qwen2.5-0.5b-instruct-q4_k_m.gguf.sha256'"
            adb shell run-as ai.bozer.app ls -lh "$APP_MODEL_DIR"
            adb logcat -c
            gradle :app:connectedDebugAndroidTest --no-daemon
            adb shell am force-stop ai.bozer.app
            adb shell am start -n ai.bozer.app/.MainActivity
            sleep 8
            pid="$(adb shell pidof ai.bozer.app | tr -d '\r')"
            test -n "$pid"
            echo "BOZER_PID=$pid"
            adb logcat -d -v brief -s BOZER_E2E:I AndroidRuntime:E > bozer-emulator-test.log
            if grep -Eq 'FATAL EXCEPTION|E/AndroidRuntime|Process: ai[.]bozer[.]app' bozer-emulator-test.log; then
              cat bozer-emulator-test.log
              echo "AndroidRuntime reported a fatal application error."
              exit 1
            fi
            adb exec-out screencap -p > bozer-smoke.png
            test -s bozer-smoke.png
      - name: Upload emulator screenshot and brain test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bozer-emulator-brain-e2e
          path: |
            bozer-smoke.png
            bozer-emulator-test.log
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
