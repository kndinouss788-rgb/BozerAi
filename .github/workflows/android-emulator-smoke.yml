name: BOZER Android emulator validation — manual only

# This workflow is intentionally disabled for push/PR events.
# Do not run it until implementation has reached the planned validation phase.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-brain-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare the embedded BOZER brain
        run: |
          chmod +x scripts/prepare_bundled_model.sh
          scripts/prepare_bundled_model.sh app/src/main/assets
      - name: Build the BOZER APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Install and run the instrumented suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 4
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bozer-emulator-validation
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
