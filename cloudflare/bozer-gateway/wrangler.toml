name = "bozer-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-07"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "bozer-gateway-quota"
database_id = "a346764f-a8ef-4393-b84f-cabb779aabfe"

[vars]
USER_DAILY_REQUEST_CAP = "20"
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "openai/gpt-oss-20b"
PROVIDER_ORDER = "gemini,groq,cerebras,sambanova,mistral,nvidia,openrouter,cloudflare-ai"
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
